version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: terraform
    directory: /
    schedule:
      interval: monthly
    groups:
      terraform:
        patterns: ["*"]
    cooldown:
      default-days: 7
